version: '3.8'

services:
  ecowatch-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecowatch-intelligence-web
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=ecowatch_user
      - MYSQL_PASSWORD=ecowatch_secure_pass
      - MYSQL_DATABASE=ecowatch
      - JWT_SECRET=ecowatch-production-jwt-secret-key-2026
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - ecowatch-network

  mysql:
    image: mysql:8.0
    container_name: ecowatch-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_DATABASE: ecowatch
      MYSQL_USER: ecowatch_user
      MYSQL_PASSWORD: ecowatch_secure_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ecowatch-app/server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - ecowatch-network

volumes:
  mysql_data:
    driver: local

networks:
  ecowatch-network:
    driver: bridge

